name: CI

on:
  push:
  pull_request:

jobs:
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        uses: ./.github/actions/local-supabase

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test unit and node projects
        run: npm run test:ci -- --selectProjects dom node
        env:
          # Leave these empty so jest.setup.js installs the mocked values for
          # dom/node projects; the real Supabase URL is isolated to the db project.
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''

      - name: Test database and RLS project
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  eval-gate:
    name: Eval harness gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real local Postgres/Auth/PostgREST stack (supabase/config.toml),
      # applying the committed schema — see local-supabase-validation req.
      # 1. The eval harness's RPC-backed retrieval/aggregate/HITL cases
      # need a real database; a mocked `.rpc()`/`.from()` would be exactly
      # the false-green class of bug this harness exists to catch.
      - name: Start local Supabase stack
        run: npx supabase start

      # Read-only comparison against the COMMITTED evals/baseline/
      # baseline.json — this step never re-baselines and contains no
      # numeric threshold literal. Thresholds/tolerances/blocking flags
      # live only in baseline.json (ai-eval-harness req. 10). Fails the
      # build ONLY when a metric with `blocking: true` regresses past its
      # committed `value - tolerance`.
      - name: Run eval harness gate
        run: npm run eval:gate

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  e2e-no-auth:
    name: E2E no-auth
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        uses: ./.github/actions/local-supabase

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate Playwright lane (no-auth)
        run: npm run e2e:validate-lane
        env:
          PLAYWRIGHT_LANE: no-auth
          PLAYWRIGHT_NO_AUTH_SETUP: '1'
          FRONTEND_AUTH_BYPASS: '1'

      - name: Run Playwright no-auth lane
        run: npm run e2e:ci:no-auth

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  e2e-auth-required:
    name: E2E auth-required
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        uses: ./.github/actions/local-supabase

      - name: Provision canonical local auth user
        run: npx tsx scripts/testing/prepare-local-supabase-ci.ts --provision-canonical-auth-user

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Playwright lane (auth-required)
        run: npm run e2e:validate-lane
        env:
          PLAYWRIGHT_LANE: auth-required

      - name: Run Playwright auth-required lane
        run: npm run e2e:ci:auth-required

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
