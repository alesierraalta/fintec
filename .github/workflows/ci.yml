name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'test-service-role-key' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  eval-gate:
    name: Eval harness gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real local Postgres/Auth/PostgREST stack (supabase/config.toml),
      # applying the committed schema — see local-supabase-validation req.
      # 1. The eval harness's RPC-backed retrieval/aggregate/HITL cases
      # need a real database; a mocked `.rpc()`/`.from()` would be exactly
      # the false-green class of bug this harness exists to catch.
      - name: Start local Supabase stack
        run: npx supabase start

      # Read-only comparison against the COMMITTED evals/baseline/
      # baseline.json — this step never re-baselines and contains no
      # numeric threshold literal. Thresholds/tolerances/blocking flags
      # live only in baseline.json (ai-eval-harness req. 10). Fails the
      # build ONLY when a metric with `blocking: true` regresses past its
      # committed `value - tolerance`.
      - name: Run eval harness gate
        run: npm run eval:gate

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  e2e-no-auth:
    name: E2E no-auth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'test-service-role-key' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Playwright lane (no-auth)
        run: npm run e2e:validate-lane
        env:
          PLAYWRIGHT_LANE: no-auth
          PLAYWRIGHT_NO_AUTH_SETUP: '1'
          FRONTEND_AUTH_BYPASS: '1'

      - name: Run Playwright no-auth lane
        run: >-
          npm run e2e:ci:no-auth --
          tests/e2e/auth-bypass-protected-routes.spec.ts
          tests/e2e/auth-google-button.spec.ts
          --project=chromium

  e2e-auth-required:
    name: E2E auth-required
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}
      FINTEC_TEST_USER_EMAIL: ${{ secrets.FINTEC_TEST_USER_EMAIL }}
      FINTEC_TEST_USER_PASSWORD: ${{ secrets.FINTEC_TEST_USER_PASSWORD }}
      FINTEC_TEST_USER_NAME: ${{ secrets.FINTEC_TEST_USER_NAME }}
      FINTEC_TEST_USER_BASE_CURRENCY: ${{ secrets.FINTEC_TEST_USER_BASE_CURRENCY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Playwright lane (auth-required)
        run: npm run e2e:validate-lane
        env:
          PLAYWRIGHT_LANE: auth-required

      - name: Run Playwright auth-required lane
        run: npm run e2e:ci:auth-required
